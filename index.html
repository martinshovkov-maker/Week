<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<title>Week</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 14px 90px;user-select:none}
  .days-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:380px;width:100%;margin-bottom:14px}
  .day-btn{background:#161616;color:#a0a0a0;border:1px solid #222;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer}
  .day-btn.active{background:#2c2c2c;color:#fff;border-color:#444}
  .day-btn.today-mark{box-shadow:0 0 0 1px #555}
  .home-btn{background:transparent;border:none;cursor:pointer;padding:8px;margin-bottom:18px;opacity:.7}
  .home-btn.active{opacity:1}
  #home-view,#day-view{display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px}
  #day-view{display:none}
  .meme-card{position:relative;width:230px;height:230px;border-radius:22px;overflow:hidden;background:#121212;border:1px solid #1f1f1f;margin-bottom:24px;cursor:pointer}
  .meme-card img{width:100%;height:100%;object-fit:cover}
  .meme-text{position:absolute;bottom:10px;left:8px;right:8px;text-align:center;font-size:15px;font-weight:800;line-height:1.25;color:#fff;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 6px #000}
  .play-main-btn{width:220px;height:54px;border-radius:27px;background:#181818;border:1px solid #282828;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .edit-actions{display:flex;gap:10px;margin-bottom:20px}
  .pill-btn{background:#181818;color:#e0e0e0;border:1px solid #2a2a2a;border-radius:20px;padding:9px 18px;font-size:14px;cursor:pointer}
  .track-list{width:100%;display:flex;flex-direction:column;gap:10px}
  .track-item{display:flex;align-items:center;justify-content:space-between;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:14px;padding:10px 14px}
  .track-info{display:flex;align-items:center;gap:12px;overflow:hidden;flex:1;cursor:pointer}
  .track-cover{width:42px;height:42px;border-radius:8px;background:#1c1c1c;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#777}
  .track-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track-item.playing .track-title{color:#1db954}
  .delete-btn{background:transparent;border:none;color:#666;padding:8px;cursor:pointer}
  .empty-hint{color:#555;font-size:14px;text-align:center;margin-top:30px}
  .mini-player{position:fixed;bottom:12px;left:12px;right:12px;max-width:400px;margin:0 auto;background:#141414;border:1px solid #262626;border-radius:18px;padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:100}
  .mini-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .mini-controls{display:flex;align-items:center;gap:14px}
  .ctrl-btn{background:none;border:none;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="days-grid" id="days-grid"></div>
  <button class="home-btn active" id="home-btn"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg></button>
  <div id="home-view">
    <div class="meme-card" id="meme-card"><img id="meme-img"><div class="meme-text" id="meme-text"></div></div>
    <button class="play-main-btn" id="play-today-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
  </div>
  <div id="day-view">
    <div class="edit-actions"><button class="pill-btn" id="add-songs-btn">Редактировать +</button><button class="pill-btn" id="change-meme-btn">Фото котика</button></div>
    <div class="track-list" id="track-list"></div>
  </div>
  <input type="file" id="audio-input" accept="audio/*" multiple hidden>
  <input type="file" id="image-input" accept="image/*" hidden>
  <div class="mini-player" id="mini-player">
    <div class="mini-title" id="mini-title">Трек</div>
    <div class="mini-controls">
      <button class="ctrl-btn" id="prev-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctrl-btn" id="toggle-play-btn"><svg id="play-pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
      <button class="ctrl-btn" id="next-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>
  <audio id="audio-player"></audio>
<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  const DAYS=[{key:'Monday',ru:'понедельник'},{key:'Tuesday',ru:'вторник'},{key:'Wednesday',ru:'среда'},{key:'Thursday',ru:'четверг'},{key:'Friday',ru:'пятница'},{key:'Saturday',ru:'суббота'},{key:'Sunday',ru:'воскресенье'}];
  const CAT='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://w3.org" viewBox="0 0 300 300"><rect width="300" height="300" fill="#1e1e1e"/><polygon points="75,120 95,45 140,95" fill="#d9d9d9"/><polygon points="225,120 205,45 160,95" fill="#d9d9d9"/><circle cx="150" cy="155" r="80" fill="#e6e6e6"/><circle cx="122" cy="142" r="12" fill="#111"/><circle cx="178" cy="142" r="12" fill="#111"/><polygon points="143,165 157,165 150,174" fill="#ff8da1"/></svg>');
  const dIdx=new Date().getDay(),today=DAYS[dIdx===0?6:dIdx-1];
  let selDay=null,db,pl=[],idx=0,url=null;
  const req=indexedDB.open('WeekDB',1);
  req.onupgradeneeded=e=>{const d=e.target.result;d.createObjectStore('t',{keyPath:'id',autoIncrement:true});d.createObjectStore('m',{keyPath:'day'})};
  req.onsuccess=e=>{db=e.target.result;openHome()};
  const dbOp=(s,m,fn)=>new Promise(r=>{const tx=db.transaction(s,m),q=fn(tx.objectStore(s));if(q)q.onsuccess=()=>r(q.result);else tx.oncomplete=r});
  const $=id=>document.getElementById(id);
  function renderBar(){$('days-grid').innerHTML='';DAYS.forEach(d=>{const b=document.createElement('button');b.className='day-btn'+(d.key===today.key?' today-mark':'')+(selDay===d.key?' active':'');b.textContent=d.key;b.onclick=()=>openDay(d.key);$('days-grid').appendChild(b)})}
  async function openHome(){selDay=null;renderBar();$('home-btn').classList.add('active');$('home-view').style.display='flex';$('day-view').style.display='none';$('meme-text').textContent=`Привет бро, сегодня ${today.ru}, вот плейлист на сегодня`;const m=await dbOp('m','readonly',s=>s.get(today.key));$('meme-img').src=m?URL.createObjectURL(m.blob):CAT}
  async function openDay(k){selDay=k;renderBar();$('home-btn').classList.remove('active');$('home-view').style.display='none';$('day-view').style.display='flex';renderTracks(k)}
  async function renderTracks(k){const all=await dbOp('t','readonly',s=>s.getAll()),list=all.filter(x=>x.day===k);$('track-list').innerHTML=list.length?'':'<div class="empty-hint">Пока пусто. Нажми «Редактировать +», чтобы добавить треки.</div>';list.forEach((tr,i)=>{const el=document.createElement('div');el.className='track-item'+(pl[idx]?.id===tr.id?' playing':'');el.innerHTML=`<div class="track-info"><div class="track-cover">♪</div><div class="track-title">${tr.name}</div></div><button class="delete-btn">🗑</button>`;el.querySelector('.track-info').onclick=()=>{pl=list;idx=i;play()};el.querySelector('.delete-btn').onclick=async()=>{await dbOp('t','readwrite',s=>s.delete(tr.id));renderTracks(k)};$('track-list').appendChild(el)})}
  function play(){const tr=pl[idx];if(!tr)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(tr.blob);$('audio-player').src=url;$('audio-player').play();$('mini-player').style.display='flex';$('mini-title').textContent=tr.name;$('play-pause-icon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';if(selDay)renderTracks(selDay)}
  $('add-songs-btn').onclick=()=>$('audio-input').click();
  $('audio-input').onchange=async e=>{for(const f of e.target.files)await dbOp('t','readwrite',s=>s.add({day:selDay,name:f.name.replace(/\.[^/.]+$/,''),blob:f}));e.target.value='';renderTracks(selDay)};
  $('change-meme-btn').onclick=()=>$('image-input').click();
  $('meme-card').onclick=()=>{selDay=today.key;$('image-input').click()};
  $('image-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=selDay||today.key;await dbOp('m','readwrite',s=>s.put({day:t,blob:f}));e.target.value='';$('home-view').style.display!=='none'?openHome():alert('Фото обновлено')};
  $('play-today-btn').onclick=async()=>{const all=await dbOp('t','readonly',s=>s.getAll()),list=all.filter(x=>x.day===today.key);if(!list.length)return alert(`На ${today.ru} пока нет песен!`);pl=list;idx=0;play()};
  $('toggle-play-btn').onclick=()=>{const a=$('audio-player');if(a.paused){a.play();$('play-pause-icon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'}else{a.pause();$('play-pause-icon').innerHTML='<path d="M8 5v14l11-7z"/>'}};
  $('next-btn').onclick=()=>{if(pl.length){idx=(idx+1)%pl.length;play()}};
  $('prev-btn').onclick=()=>{if(pl.length){idx=(idx-1+pl.length)%pl.length;play()}};
  $('audio-player').onended=()=>{idx=(idx+1)%pl.length;play()};
  $('home-btn').onclick=openHome;
</script>
</body>
</html>
