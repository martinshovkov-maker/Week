<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<title>Week</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px 90px;user-select:none}
.days-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:360px;width:100%;margin-bottom:18px}
.day-btn{background:#222222;color:#b8b8b8;border:1px solid #2d2d2d;border-radius:18px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.day-btn.active{background:#343434;color:#ffffff;border-color:#484848}
.home-btn{background:none;border:none;cursor:pointer;padding:6px;margin-bottom:28px;color:#8e8e8e;transition:color .15s}
.home-btn.active{color:#ffffff}
#home-view,#day-view{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}
#day-view{display:none}
.meme-card{position:relative;width:215px;height:215px;border-radius:16px;overflow:hidden;background:#1c1c1c;margin-bottom:32px;cursor:pointer}
.meme-card img{width:100%;height:100%;object-fit:cover;display:block}
.meme-text{position:absolute;bottom:8px;left:6px;right:6px;text-align:center;font-size:15px;font-weight:800;line-height:1.18;color:#ffffff;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 5px #000;pointer-events:none}
.play-main-btn{width:215px;height:52px;border-radius:26px;background:#222222;border:1px solid #2c2c2c;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,background .15s}
.play-main-btn:active{background:#2c2c2c;transform:scale(.97)}
.edit-actions{display:flex;justify-content:center;margin-bottom:22px}
.pill-btn{background:#222222;color:#dcdcdc;border:1px solid #2e2e2e;border-radius:20px;padding:9px 22px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px}
.track-list{width:100%;display:flex;flex-direction:column;gap:12px}
.track-item{display:flex;align-items:center;justify-content:space-between;padding:4px 6px}
.track-info{display:flex;align-items:center;gap:14px;overflow:hidden;flex:1;cursor:pointer}
.track-cover{width:44px;height:44px;border-radius:8px;background:#1e1e1e;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#777}
.track-meta{display:flex;flex-direction:column;overflow:hidden}
.track-title{font-size:15px;font-weight:500;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:12px;color:#828282;margin-top:2px}
.track-item.playing .track-title{color:#1db954}
.delete-btn{background:none;border:none;color:#636363;padding:8px;cursor:pointer}
.empty-hint{color:#5e5e5e;font-size:14px;text-align:center;margin-top:36px}
.mini-player{position:fixed;bottom:14px;left:14px;right:14px;max-width:380px;margin:0 auto;background:#1f1f1f;border:1px solid #2e2e2e;border-radius:18px;padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.mini-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mini-controls{display:flex;align-items:center;gap:14px}
.ctrl-btn{background:none;border:none;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="days-grid" id="days-grid"></div>
<button class="home-btn active" id="home-btn">
<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12.71 2.29a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 1.42 1.42L4 12.41V20a2 2 0 0 0 2 2h4v-6h4v6h4a2 2 0 0 0 2-2v-7.59l.29.3a1 1 0 0 0 1.42-1.42L19 8.59V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v.59l-2.29-2.3z"/></svg>
</button>
<div id="home-view">
<div class="meme-card" id="meme-card"><img id="meme-img" src="cat.jpg"><div class="meme-text" id="meme-text"></div></div>
<button class="play-main-btn" id="play-today-btn"><svg width="21" height="21" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg></button>
</div>
<div id="day-view">
<div class="edit-actions"><button class="pill-btn" id="add-songs-btn">Редактировать <span style="font-size:18px;line-height:1">+</span></button></div>
<div class="track-list" id="track-list"></div>
</div>
<input type="file" id="audio-input" accept="audio/*" multiple hidden>
<input type="file" id="image-input" accept="image/*" hidden>
<div class="mini-player" id="mini-player">
<div class="mini-title" id="mini-title">Трек</div>
<div class="mini-controls">
<button class="ctrl-btn" id="prev-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
<button class="ctrl-btn" id="toggle-play-btn"><svg id="play-pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
<button class="ctrl-btn" id="next-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
</div>
</div>
<audio id="audio-player"></audio>
<script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
const DAYS=[{key:'Monday',ru:'понедельник'},{key:'Tuesday',ru:'вторник'},{key:'Wednesday',ru:'среда'},{key:'Thursday',ru:'четверг'},{key:'Friday',ru:'пятница'},{key:'Saturday',ru:'суббота'},{key:'Sunday',ru:'воскресенье'}];
const dIdx=new Date().getDay(),today=DAYS[dIdx===0?6:dIdx-1];let selDay=null,db,pl=[],idx=0,url=null;
const req=indexedDB.open('WeekDB',1);
req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('t'))d.createObjectStore('t',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'day'})};
req.onsuccess=e=>{db=e.target.result;openHome()};
const dbOp=(s,m,fn)=>new Promise(r=>{const tx=db.transaction(s,m),q=fn(tx.objectStore(s));if(q)q.onsuccess=()=>r(q.result);else tx.oncomplete=r});
const $=id=>document.getElementById(id);
function renderBar(){$('days-grid').innerHTML='';DAYS.forEach(d=>{const b=document.createElement('button');b.className='day-btn'+(selDay===d.key?' active':'');b.textContent=d.key;b.onclick=()=>openDay(d.key);$('days-grid').appendChild(b)})}
async function openHome(){selDay=null;renderBar();$('home-btn').classList.add('active');$('home-view').style.display='flex';$('day-view').style.display='none';$('meme-text').textContent=`Привет бро, сегодня ${today.ru}, вот плейлист на сегодня`;const m=await dbOp('m','readonly',s=>s.get(today.key));$('meme-img').src=m?URL.createObjectURL(m.blob):'cat.jpg'}
async function openDay(k){selDay=k;renderBar();$('home-btn').classList.remove('active');$('home-view').style.display='none';$('day-view').style.display='flex';renderTracks(k)}
async function renderTracks(k){const all=await dbOp('t','readonly',s=>s.getAll()),list=all.filter(x=>x.day===k);$('track-list').innerHTML=list.length?'':'<div class="empty-hint">Пока пусто. Нажми «Редактировать +», чтобы добавить треки.</div>';list.forEach((tr,i)=>{const el=document.createElement('div');el.className='track-item'+(pl[idx]?.id===tr.id?' playing':'');el.innerHTML=`<div class="track-info"><div class="track-cover"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div><div class="track-meta"><div class="track-title">${tr.name}</div><div class="track-sub">${k}</div></div></div><button class="delete-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>`;el.querySelector('.track-info').onclick=()=>{pl=list;idx=i;play()};el.querySelector('.delete-btn').onclick=async()=>{await dbOp('t','readwrite',s=>s.delete(tr.id));renderTracks(k)};$('track-list').appendChild(el)})}
function play(){const tr=pl[idx];if(!tr)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(tr.blob);$('audio-player').src=url;$('audio-player').play();$('mini-player').style.display='flex';$('mini-title').textContent=tr.name;$('play-pause-icon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';if(selDay)renderTracks(selDay)}
$('add-songs-btn').onclick=()=>$('audio-input').click();
$('audio-input').onchange=async e=>{for(const f of e.target.files)await dbOp('t','readwrite',s=>s.add({day:selDay,name:f.name.replace(/\.[^/.]+$/,''),blob:f}));e.target.value='';renderTracks(selDay)};
$('meme-card').onclick=()=>$('image-input').click();
$('image-input').onchange=async e=>{const f=e.target.files;if(!f)return;await dbOp('m','readwrite',s=>s.put({day:today.key,blob:f}));e.target.value='';openHome()};
$('play-today-btn').onclick=async()=>{const all=await dbOp('t','readonly',s=>s.getAll()),list=all.filter(x=>x.day===today.key);if(!list.length)return alert(`На ${today.ru} пока нет песен!`);pl=list;idx=0;play()};
$('toggle-play-btn').onclick=()=>{const a=$('audio-player');if(a.paused){a.play();$('play-pause-icon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'}else{a.pause();$('play-pause-icon').innerHTML='<path d="M8 5v14l11-7z"/>'}};
$('next-btn').onclick=()=>{if(pl.length){idx=(idx+1)%pl.length;play()}};
$('prev-btn').onclick=()=>{if(pl.length){idx=(idx-1+pl.length)%pl.length;play()}};
$('audio-player').onended=()=>{idx=(idx+1)%pl.length;play()};
$('home-btn').onclick=openHome;
</script>
</body>
</html>
